    background: rgba(55, 53, 47, 0.08);
    color: rgb(55, 53, 47);
    font-weight: 600;
  }
  html { scroll-behavior: smooth; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const headings = Array.from(document.querySelectorAll(".page-body h3"));
  if (headings.length < 2) return;

  const details = document.createElement("details");
  details.className = "floating-toc";
  if (window.innerWidth >= 1180) details.open = true;

  const summary = document.createElement("summary");
  summary.textContent = "🎵 Índice (" + headings.length + ")";
  details.appendChild(summary);

  const ul = document.createElement("ul");
  const links = [];

  headings.forEach((h, i) => {
    const text = h.textContent.trim();
    if (!text || text.startsWith("—")) return;
    if (!h.id) h.id = "song-" + i;

    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = text;
    a.title = text;
    li.appendChild(a);
    ul.appendChild(li);
    links.push({ heading: h, link: a });
  });

  if (links.length < 2) return;
  details.appendChild(ul);

  const pageBody = document.querySelector(".page-body");
  pageBody.parentNode.insertBefore(details, pageBody);

  window.addEventListener("scroll", () => {
    let current = links[0];
    for (const item of links) {
      if (item.heading.getBoundingClientRect().top <= 120) current = item;
    }
    links.forEach(item => item.link.classList.toggle("active", item === current));
  }, { passive: true });
});
</script>
</body></html>
